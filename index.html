<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mason Barnocky — contact card.">
<title>Mason Barnocky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0A0D11;
    --ink: #F4F0E6;
    --ink-dim: #7C838C;
    --glow: #63E0D1;
    --glow-dim: #2E5C58;
    --ember: #E8794B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    color: var(--ink);
    font-family: "Space Mono", ui-monospace, monospace;
    overflow: hidden;
  }

  #field {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 6vw;
    gap: clamp(28px, 6vh, 56px);
  }

  .name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 340;
    line-height: 0.86;
    font-size: clamp(3.4rem, 13vw, 10.5rem);
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
    will-change: transform;
    transition: transform 0.18s ease-out;
    opacity: 0;
    transform: translateY(18px);
    animation: rise 1.1s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }

  .name em {
    font-style: italic;
    font-weight: 300;
    color: var(--glow);
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vw, 40px);
    opacity: 0;
    animation: rise 1s cubic-bezier(.2,.8,.2,1) 0.55s forwards;
  }

  .link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 2px;
    transition: color 0.25s ease;
  }

  .link::after {
    content: "";
    position: absolute;
    left: 0; right: 100%;
    bottom: 0;
    height: 1px;
    background: var(--glow);
    transition: right 0.35s cubic-bezier(.2,.8,.2,1);
  }

  .link:hover, .link:focus-visible {
    color: var(--ink);
  }

  .link:hover::after, .link:focus-visible::after {
    right: 0;
  }

  .link .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--ink-dim);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  .link:hover .dot, .link:focus-visible .dot {
    background: var(--glow);
    box-shadow: 0 0 10px 2px var(--glow-dim);
  }

  .mark {
    position: fixed;
    left: 22px;
    bottom: 20px;
    z-index: 2;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--ink-dim);
    opacity: 0.7;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mark .dash {
    width: 14px;
    height: 1px;
    background: var(--ink-dim);
  }

  .hint {
    position: fixed;
    right: 22px;
    bottom: 20px;
    z-index: 2;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    opacity: 0;
    animation: fadeIn 1s ease 1.4s forwards;
  }

  @keyframes fadeIn { to { opacity: 0.55; } }

  @media (max-width: 560px) {
    .hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .name, .links, .hint {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .name { transition: none; }
  }

  :focus-visible {
    outline: 1px solid var(--glow);
    outline-offset: 4px;
  }
</style>
</head>
<body>


<canvas id="field"></canvas>

<main class="stage">
  <h1 class="name">Mason<br><em>Barnocky</em></h1>

  <nav class="links">
    <a class="link" href="mailto:masonbarnocky@gmail.com"><span class="dot"></span>Email</a>
    <a class="link" href="https://github.com/masonbarnocky" target="_blank" rel="noopener"><span class="dot"></span>GitHub</a>
    <a class="link" href="https://www.linkedin.com/in/mason-barnocky" target="_blank" rel="noopener"><span class="dot"></span>LinkedIn</a>
  </nav>
</main>

<div class="mark"><span class="dash"></span>BOZEMAN, MT</div>
<div class="hint">move / click</div>

<script>
(function () {
  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  var mouse = { x: W / 2, y: H / 2, active: false };
  var target = { x: W / 2, y: H / 2 };

  function setPointer(x, y) {
    target.x = x;
    target.y = y;
    mouse.active = true;
  }

  window.addEventListener("mousemove", function (e) {
    setPointer(e.clientX, e.clientY);
    var nx = (e.clientX / W - 0.5);
    var ny = (e.clientY / H - 0.5);
    var nameEl = document.querySelector(".name");
    if (nameEl && !reduceMotion) {
      nameEl.style.transform = "translate(" + (nx * -14) + "px," + (ny * -10) + "px)";
    }
  }, { passive: true });

  window.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches[0]) {
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  var ripples = [];
  function addRipple(x, y, strength) {
    ripples.push({ x: x, y: y, t: 0, strength: strength || 1 });
  }

  window.addEventListener("pointerdown", function (e) {
    addRipple(e.clientX, e.clientY, 1.6);
  });

  document.querySelectorAll(".link").forEach(function (a) {
    a.addEventListener("mouseenter", function () {
      var r = a.getBoundingClientRect();
      addRipple(r.left + r.width / 2, r.top + r.height / 2, 1);
    });
  });

  var LINES = 16;
  var t0 = performance.now();

  function draw(now) {
    var t = (now - t0) / 1000;
    mouse.x += (target.x - mouse.x) * 0.08;
    mouse.y += (target.y - mouse.y) * 0.08;

    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < ripples.length; i++) {
      ripples[i].t += 1 / 60;
    }
    ripples = ripples.filter(function (r) { return r.t < 2.4; });

    var spacing = H / (LINES - 1);

    for (var li = 0; li < LINES; li++) {
      var baseY = li * spacing;
      var depth = li / (LINES - 1);
      ctx.beginPath();

      var step = 8;
      for (var x = -step; x <= W + step; x += step) {
        var y = baseY;
        y += Math.sin(x * 0.0028 + t * 0.35 + li * 0.6) * 10;
        y += Math.sin(x * 0.0009 - t * 0.18 + li) * 16;

        if (mouse.active) {
          var dx = x - mouse.x;
          var dy = baseY - mouse.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var influence = Math.exp(-dist / 220);
          y -= influence * 46;
        }

        for (var ri = 0; ri < ripples.length; ri++) {
          var rp = ripples[ri];
          var rdx = x - rp.x;
          var rdy = baseY - rp.y;
          var rdist = Math.sqrt(rdx * rdx + rdy * rdy);
          var wave = rp.t * 340;
          var band = Math.exp(-Math.pow(rdist - wave, 2) / 2600);
          var decay = Math.max(0, 1 - rp.t / 2.4);
          y += band * decay * 26 * rp.strength;
        }

        if (x === -step) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      var alpha = 0.05 + depth * 0.16;
      ctx.strokeStyle = "rgba(99, 224, 209, " + alpha + ")";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (!reduceMotion) requestAnimationFrame(draw);
  }

  if (reduceMotion) {
    draw(performance.now());
  } else {
    requestAnimationFrame(draw);
  }
})();
</script>

</body>
</html>
